<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 800" width="1250" height="800" role="img" aria-labelledby="t d">
  <title id="t">LittleCrawler: how the classes work together</title>
  <desc id="d">The window starts SearchThread. SearchThread takes the next URL and gives a LinkProcessor to the ThreadPool. The pool hands the job to an idle ThreadPoolWorker, which runs it. The job downloads the page, saves it, downloads the files it references, and sends the new page links back to SearchThread.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3e4c59"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .h1 { font-size: 20px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #52606d; }
      .name { font-size: 14px; font-weight: 600; }
      .t { font-size: 11.5px; }
      .s { font-size: 11.5px; fill: #52606d; }
      .xs { font-size: 10.5px; fill: #52606d; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .lbl { font-size: 11.5px; fill: #3e4c59; }
      .lc { fill: #e8f1fd; stroke: #3b7dd8; stroke-width: 1.5; }
      .lci { fill: #ffffff; stroke: #3b7dd8; stroke-width: 1; }
      .tp { fill: #fdf0dc; stroke: #d08a1e; stroke-width: 1.5; }
      .ut { fill: #e6f6ea; stroke: #3c9a5f; stroke-width: 1.5; }
      .ex { fill: #f3f4f6; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .a { fill: none; stroke: #3e4c59; stroke-width: 1.5; marker-end: url(#arrow); }
      .ad { fill: none; stroke: #3e4c59; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .ln { fill: none; stroke: #3e4c59; stroke-width: 1.5; }
      .tri { fill: #ffffff; stroke: #3e4c59; stroke-width: 1.5; }
      .badge { fill: #1f2933; }
      .bt { font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1249" height="799" rx="10" fill="#ffffff" stroke="#d9dde3"/>

  <text x="40" y="46" class="h1">LittleCrawler: how the classes work together</text>
  <text x="40" y="68" class="sub">Follow the numbers 1 to 6: the trip of one page, from the Download button to the saved files. Step 6 feeds step 2, until no link is left.</text>

  <!-- ===== Left column: window and settings ===== -->
  <rect x="40" y="100" width="190" height="90" rx="6" class="lc"/>
  <text x="54" y="124" class="name">WebCrawlerApplet</text>
  <text x="54" y="144" class="s">the Swing window</text>
  <text x="54" y="162" class="s">Download · Status · Stop</text>
  <text x="54" y="179" class="s">shows the progress log</text>

  <path d="M135 190 V250" class="a"/>
  <text x="145" y="225" class="lbl">settings</text>

  <rect x="40" y="250" width="190" height="65" rx="6" class="lc"/>
  <text x="54" y="275" class="name" style="font-size:13.5px">WebCrawlerProperties</text>
  <text x="54" y="296" class="s">the settings of this run</text>

  <path d="M135 315 V370" class="a"/>
  <text x="145" y="347" class="lbl">read at start</text>

  <rect x="40" y="370" width="190" height="56" rx="6" class="ex"/>
  <text x="54" y="393" class="code">config/</text>
  <text x="54" y="410" class="code">webCrawler.properties</text>

  <!-- ===== SearchThread ===== -->
  <rect x="360" y="90" width="300" height="275" rx="6" class="lc"/>
  <text x="376" y="116" class="name">SearchThread</text>
  <text x="376" y="135" class="s">extends Thread · runs the crawl</text>
  <path d="M360 147 H660" stroke="#3b7dd8" stroke-width="1"/>

  <rect x="375" y="162" width="84" height="56" rx="4" class="lci"/>
  <text x="417" y="185" class="t" text-anchor="middle" style="font-weight:600">to search</text>
  <text x="417" y="203" class="xs" text-anchor="middle">URLs waiting</text>

  <rect x="468" y="162" width="84" height="56" rx="4" class="lci"/>
  <text x="510" y="185" class="t" text-anchor="middle" style="font-weight:600">searched</text>
  <text x="510" y="203" class="xs" text-anchor="middle">handed out</text>

  <rect x="561" y="162" width="84" height="56" rx="4" class="lci"/>
  <text x="603" y="185" class="t" text-anchor="middle" style="font-weight:600">found</text>
  <text x="603" y="203" class="xs" text-anchor="middle">all links seen</text>

  <text x="376" y="246" class="t" style="font-weight:600">The loop in run():</text>
  <text x="376" y="266" class="t">• takes the next URL to search</text>
  <text x="376" y="284" class="t">• gives a LinkProcessor to the pool</text>
  <text x="376" y="302" class="t">• waits for jobs to report new links</text>
  <text x="376" y="320" class="t">• ends when no URL is waiting and</text>
  <text x="386" y="337" class="t">the workers are idle, or on Stop</text>

  <!-- 1: window starts the search thread -->
  <path d="M230 128 H360" class="a"/>
  <circle cx="262" cy="112" r="9" class="badge"/><text x="262" y="116" class="bt">1</text>
  <text x="276" y="116" class="lbl">Download</text>
  <path d="M360 160 H230" class="ad"/>
  <text x="295" y="177" class="lbl" text-anchor="middle">status, links found</text>

  <!-- ===== threadpool ===== -->
  <rect x="770" y="100" width="180" height="80" rx="6" class="tp"/>
  <text x="784" y="124" class="name">ThreadPool</text>
  <text x="784" y="144" class="s">execute(job) waits for</text>
  <text x="784" y="161" class="s">an idle worker</text>

  <rect x="770" y="245" width="180" height="65" rx="6" class="tp"/>
  <text x="784" y="270" class="name">FIFOQueue</text>
  <text x="784" y="291" class="s">the line of idle workers</text>

  <rect x="1066" y="116" width="170" height="110" rx="6" class="tp"/>
  <rect x="1058" y="108" width="170" height="110" rx="6" class="tp"/>
  <rect x="1050" y="100" width="170" height="110" rx="6" class="tp"/>
  <text x="1064" y="124" class="name">ThreadPoolWorker</text>
  <text x="1064" y="144" class="s">× the number of threads</text>
  <text x="1064" y="164" class="s">one thread each; a timer</text>
  <text x="1064" y="181" class="s">interrupts a job that</text>
  <text x="1064" y="198" class="s">takes too long</text>

  <!-- 2: search thread gives a job to the pool -->
  <path d="M660 135 H770" class="a"/>
  <circle cx="677" cy="114" r="9" class="badge"/><text x="677" y="118" class="bt">2</text>
  <text x="690" y="118" class="lbl">execute(job)</text>

  <path d="M860 180 V245" class="a"/>
  <text x="870" y="217" class="lbl">takes an idle worker</text>

  <!-- 3: pool hands the job to a worker -->
  <path d="M950 150 H1050" class="a"/>
  <circle cx="963" cy="114" r="9" class="badge"/><text x="963" y="118" class="bt">3</text>
  <text x="976" y="118" class="lbl">hands over</text>
  <text x="976" y="133" class="lbl">the job</text>

  <path d="M1050 190 H1000 V277 H950" class="a"/>
  <text x="1008" y="252" class="lbl">back in line</text>
  <text x="1008" y="267" class="lbl">when done</text>

  <!-- ===== The jobs ===== -->
  <rect x="330" y="480" width="520" height="115" rx="6" class="lc"/>
  <text x="346" y="505" class="name">ContentProcessor</text>
  <text x="476" y="505" class="s">abstract · Runnable · one job for a worker</text>
  <text x="346" y="531" class="t"><tspan class="code">readWriteContent()</tspan>  downloads a page or a file and saves it</text>
  <text x="346" y="551" class="t"><tspan class="code">processContent()</tspan>  scans the page for links in &lt;a&gt;, &lt;img&gt;, &lt;script&gt; and other tags</text>
  <text x="346" y="575" class="t">A link to a file is downloaded at once, by a ResourceDownloader in the same worker.</text>

  <!-- subclasses -->
  <path d="M410 655 V634 H770 V655" class="ln"/>
  <path d="M590 655 V609" class="ln"/>
  <path d="M590 596 L599 610 H581 z" class="tri"/>
  <text x="604" y="625" class="lbl">extends</text>

  <rect x="330" y="655" width="160" height="70" rx="6" class="lc"/>
  <text x="344" y="679" class="name">FileProcessor</text>
  <text x="344" y="699" class="s">a local starting file:</text>
  <text x="344" y="715" class="s">read and scan</text>

  <rect x="510" y="655" width="160" height="70" rx="6" class="lc"/>
  <text x="524" y="679" class="name">LinkProcessor</text>
  <text x="524" y="699" class="s">one page:</text>
  <text x="524" y="715" class="s">download, save and scan</text>

  <rect x="690" y="655" width="160" height="70" rx="6" class="lc"/>
  <text x="704" y="679" class="name">ResourceDownloader</text>
  <text x="704" y="699" class="s">one file: download and</text>
  <text x="704" y="715" class="s">save, unless it exists</text>

  <!-- 4: the worker runs the job -->
  <path d="M1170 226 V440 H780 V480" class="a"/>
  <circle cx="800" cy="424" r="9" class="badge"/><text x="800" y="428" class="bt">4</text>
  <text x="814" y="428" class="lbl">the worker runs the job</text>

  <!-- 5: download and save -->
  <rect x="960" y="480" width="250" height="65" rx="6" class="ex"/>
  <text x="974" y="505" class="name">Web site</text>
  <text x="974" y="526" class="s">pages and files, over http or https</text>

  <rect x="960" y="600" width="250" height="65" rx="6" class="ex"/>
  <text x="974" y="625" class="name">Destination folder</text>
  <text x="974" y="646" class="s">saved pages and files, and the two logs</text>

  <path d="M850 512 H960" class="a"/>
  <circle cx="867" cy="494" r="9" class="badge"/><text x="867" y="498" class="bt">5</text>
  <text x="880" y="498" class="lbl">downloads</text>

  <path d="M850 572 H905 V632 H960" class="a"/>
  <text x="913" y="604" class="lbl">saves</text>

  <!-- 6: new page links go back to the search thread -->
  <path d="M430 480 V365" class="a"/>
  <circle cx="451" cy="408" r="9" class="badge"/><text x="451" y="412" class="bt">6</text>
  <text x="465" y="412" class="lbl">new page links inside the allowed paths</text>
  <text x="465" y="429" class="code" style="fill:#3e4c59">addElementToSearch()</text>

  <!-- helpers -->
  <rect x="40" y="495" width="190" height="65" rx="6" class="lc"/>
  <text x="54" y="520" class="name">SearchUtils</text>
  <text x="54" y="541" class="s">URL helpers: page or file?</text>
  <path d="M330 527 H230" class="ad"/>
  <text x="280" y="519" class="lbl" text-anchor="middle">uses</text>

  <rect x="40" y="640" width="190" height="85" rx="6" class="ut"/>
  <text x="54" y="664" class="name">Log</text>
  <text x="54" y="684" class="s">used by every class; writes</text>
  <text x="54" y="700" class="s">crawler_*.log and</text>
  <text x="54" y="716" class="s">ThreadPool_*.log</text>

  <!-- ===== Legend ===== -->
  <path d="M40 748 H1210" stroke="#d9dde3" stroke-width="1"/>
  <rect x="40" y="762" width="14" height="14" rx="3" class="lc"/>
  <text x="61" y="774" class="s">package littlecrawler</text>
  <rect x="200" y="762" width="14" height="14" rx="3" class="tp"/>
  <text x="221" y="774" class="s">package threadpool</text>
  <rect x="355" y="762" width="14" height="14" rx="3" class="ut"/>
  <text x="376" y="774" class="s">package utils</text>
  <rect x="475" y="762" width="14" height="14" rx="3" class="ex"/>
  <text x="496" y="774" class="s">outside the program</text>

  <path d="M660 769 H700" class="a"/>
  <text x="708" y="774" class="s">calls or hands over</text>
  <path d="M850 769 H890" class="ad"/>
  <text x="898" y="774" class="s">uses or reports back</text>
  <path d="M1050 769 H1076" class="ln"/>
  <path d="M1090 769 L1076 761 V777 z" class="tri"/>
  <text x="1098" y="774" class="s">extends</text>
</svg>
