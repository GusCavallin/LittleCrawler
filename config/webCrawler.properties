# WebCrawler Properties

# Using a Proxy
http.proxySet = false
http.proxyHost = proxy.example.com
http.proxyPort = 80

webCrawler.searchWithinStartingLocationOnly = false
webCrawler.startingLocation = https://example.com/
#webCrawler.includedHostsAndPathsFile = /path/to/included-hosts-and-paths.txt
webCrawler.defaultHostAndPath = https://example.com/
# When the destination folder is not set, files are saved under the working directory.
#webCrawler.destinationFolder = /path/to/downloads

#webCrawler.numberOfThreads=50
webCrawler.workerTimeoutInS=180
